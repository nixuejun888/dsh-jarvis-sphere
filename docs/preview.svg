<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Neuron sphere behind a chat">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#0b1a22"/>
      <stop offset="55%" stop-color="#08131a"/>
      <stop offset="100%" stop-color="#050b10"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="42%" stop-color="#40dcff" stop-opacity="0"/>
      <stop offset="62%" stop-color="#40dcff" stop-opacity="0.10"/>
      <stop offset="78%" stop-color="#40dcff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#40dcff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <g transform="translate(0,-8)">
    <circle cx="480" cy="268" r="300" fill="url(#halo)"/>
  </g>

  <!-- sphere wireframe -->
  <g transform="translate(480 268)" fill="none" stroke="#40dcff">
    <g stroke-opacity="0.34" stroke-width="0.9">
      <path d="M-176 0 A176 176 0 1 1 176 0 A176 176 0 1 1 -176 0"/>
      <path d="M-176 0 A176 62 0 0 0 176 0 A176 62 0 0 0 -176 0"/>
      <path d="M-64 0 A64 176 0 0 0 64 0 A64 176 0 0 0 -64 0"/>
      <path d="M-138 -108 L-46 -168 L62 -150 L150 -78 L168 40 L108 140 L-8 176 L-124 128 L-166 22 Z"/>
      <path d="M-118 92 L-84 -36 L18 -104 L128 -52 L136 62 L42 128 L-40 128 Z"/>
    </g>
    <g stroke-opacity="0.5" stroke-width="1">
      <path d="M-176 0 L-138 -108 M-46 -168 L-118 92 M62 -150 L-84 -36 M150 -78 L18 -104
               M168 40 L128 -52 M108 140 L136 62 M-8 176 L42 128 M-124 128 L-40 128
               M-166 22 L-118 92 M-138 -108 L-84 -36 M62 -150 L128 -52 M150 -78 L136 62"/>
    </g>
  </g>

  <!-- nodes -->
  <g fill="#7ceaff" fill-opacity="0.85">
    <circle cx="304" cy="268" r="3"/>
    <circle cx="434" cy="100" r="3.2"/>
    <circle cx="542" cy="118" r="3"/>
    <circle cx="630" cy="190" r="3"/>
    <circle cx="648" cy="308" r="3"/>
    <circle cx="588" cy="408" r="3.2"/>
    <circle cx="472" cy="444" r="3"/>
    <circle cx="356" cy="396" r="3"/>
    <circle cx="314" cy="290" r="2.6"/>
    <circle cx="362" cy="160" r="2.4"/>
    <circle cx="396" cy="360" r="2.4"/>
    <circle cx="562" cy="234" r="2.4"/>
    <circle cx="520" cy="336" r="2.2"/>
  </g>

  <!-- travelling sparks -->
  <g fill="#ffb040" fill-opacity="0.9">
    <circle cx="368" cy="212" r="2.6"/>
    <circle cx="566" cy="272" r="2.2"/>
    <circle cx="470" cy="150" r="1.9"/>
  </g>

  <!-- shockwave -->
  <circle cx="480" cy="268" r="212" fill="none" stroke="#ffb040" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- orbit ring -->
  <g transform="translate(480 268) rotate(-9)">
    <ellipse rx="196" ry="56" fill="none" stroke="#40dcff" stroke-opacity="0.16" stroke-width="1.1"/>
  </g>

  <!-- chat lines behind the hollow core -->
  <g fill="#d7e6ee" fill-opacity="0.82" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="250" y="236" width="330" height="9" rx="4.5" fill-opacity="0.16"/>
    <rect x="250" y="258" width="424" height="9" rx="4.5" fill-opacity="0.13"/>
    <rect x="250" y="280" width="286" height="9" rx="4.5" fill-opacity="0.13"/>
  </g>

  <!-- HUD -->
  <g font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <text x="480" y="494" fill="#ffb040" fill-opacity="0.55" font-size="11" letter-spacing="2.5">ACTIVE · 12 TOOLS · 3 TURNS</text>
    <text x="480" y="512" fill="#40dcff" fill-opacity="0.4" font-size="9" letter-spacing="2">BASH</text>
  </g>
</svg>
