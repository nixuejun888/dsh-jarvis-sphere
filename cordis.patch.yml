# 贾维斯球形神经元背景（Host 行 + Client 浮层）
# - 记忆：读本机 Mnemon 存储根，按内容哈希聚类到球面槽位（无条数上限，正文不下发）
# - 人格：往每个会话的系统提示注入 jarvis:persona，全局生效，可关
- insert:
    - id: jarvis-sphere
      name: dsh-jarvis-sphere
      config:
        enabled: true
        nodeCount: 460
        intensity: 1
        opacity: 1
        showHud: true
        glow: true
        color: cyan
        offsetX: 0
        offsetY: 0
        persona: true
        # personaText: '覆盖内置的 JARVIS 人设正文'
        # personaFile: 'C:\\绝对路径\\persona.md'   # 空 = 用包内 persona.md
        memoryDirs: []
        memorySlots: 0
        keeper: true
        chronicle: true
        backup: true
        # backupDir: 'C:\\绝对路径'
        backupKeep: 7
        alerts: true
        memoryWrite: true
        recap: true
        report: true
        pulse: true
        scene: true
        # gauge: glow   # glow（默认）或 arc（旧弧线）
        # chronicleDir: 'C:\\绝对路径'

